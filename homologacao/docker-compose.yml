services:
  curriculos-homolog-v1:
    image: postgres:16-alpine
    container_name: curriculos-homolog-v1
    environment:
      POSTGRES_DB: curriculos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: homologacao
    ports:
      - "55432:5432"
    volumes:
      - curriculos_homolog_v1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curriculos"]
      interval: 3s
      timeout: 3s
      retries: 20

  curriculos-homolog-v2:
    image: postgres:16-alpine
    container_name: curriculos-homolog-v2
    environment:
      POSTGRES_DB: curriculos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: homologacao
    ports:
      - "55433:5432"
    volumes:
      - curriculos_homolog_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curriculos"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  curriculos_homolog_v1_data:
  curriculos_homolog_v2_data:
